<!DOCTYPE html>
<html lang="en">
<head>
    <title>API Flow Demo</title>
</head>
<body>

    <h2>Age Verification Form</h2>
    <form id="userForm">
        <label for="username">Name:</label>
        <input type="text" id="username" required>
        
        <label for="userAge">Age:</label>
        <input type="number" id="userAge" required>
        
        <button type="submit">Submit to API</button>
    </form>

    <!-- This element will hold the server's response -->
    <div id="responseMessage" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        document.getElementById('userForm').addEventListener('submit', async (event) => {
            // 1. Stop the form from refreshing the page
            event.preventDefault();

            // 2. Extract values from input fields
            const name = document.getElementById('username').value;
            const age = parseInt(document.getElementById('userAge').value);

            // 3. Prepare the message box
            const messageBox = document.getElementById('responseMessage');
            messageBox.innerText = "Sending request to backend...";

            try {
                // 4. Send a POST request to the backend API endpoint
                const response = await fetch('http://localhost:3000/api/verify-age', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json' // Tells the server we are sending JSON data
                    },
                    body: JSON.stringify({ username: name, age: age }) // Turns JS object into a string string
                });

                // 5. Parse the JSON response received from the backend
                const result = await response.json();

                // 6. Update the UI based on the response logic
                if (response.ok) {
                    messageBox.style.color = "green";
                    messageBox.innerText = `Success: ${result.message}`;
                } else {
                    messageBox.style.color = "red";
                    messageBox.innerText = `Error: ${result.error}`;
                }

            } catch (error) {
                // Catches network connection failures
                messageBox.style.color = "orange";
                messageBox.innerText = "Could not connect to the backend server.";
            }
        });
    </script>
</body>
</html>
